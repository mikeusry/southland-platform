name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, dev-audit]
  workflow_dispatch:

# Back-to-back merges otherwise race, and the last upload to finish wins even
# when it is an older commit. One deploy at a time per branch; a newer push
# replaces any queued one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter='./packages/*'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  deploy:
    name: Build & Deploy
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Build Astro site
        run: pnpm --filter @southland/astro-content build
        env:
          PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.PUBLIC_SHOPIFY_STORE_DOMAIN }}
          PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
          PUBLIC_CLOUDINARY_CLOUD_NAME: southland-organics
          PUBLIC_SITE_URL: https://southlandorganics.com
          PUBLIC_GTM_CONTAINER_ID: GTM-KT63MW
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY }}
          # Source map upload to Sentry. If the secret isn't set, the Sentry
          # plugin disables uploads (see astro.config.mjs) and the build still
          # succeeds — minified errors will just stay minified in Sentry.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Stamp build commit
        run: echo "${{ github.sha }}" > apps/astro-content/dist/version.txt

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy apps/astro-content/dist --project-name=southland-website --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} --commit-dirty=true

      # The deploy can report success while production serves another build
      # (2026-10-02: an older commit's upload finished last and went live).
      - name: Verify production serves this commit
        if: github.ref_name == 'main'
        run: |
          for i in $(seq 1 18); do
            live=$(curl -fsS "https://southlandorganics.com/version.txt?t=$(date +%s)" | tr -d '[:space:]' || true)
            if [ "$live" = "${{ github.sha }}" ]; then
              echo "Live site is ${{ github.sha }}"
              exit 0
            fi
            echo "Attempt $i: live is '${live:-unreachable}', waiting"
            sleep 10
          done
          echo "::error::Production is serving '${live:-unreachable}', not ${{ github.sha }}. Re-run this deploy."
          exit 1
